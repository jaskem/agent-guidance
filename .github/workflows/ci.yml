name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check foundation
        run: python tools/check_foundation.py
      - name: Check skill packages
        run: python tools/check_skills.py
      - name: Test vendoring contract
        run: python -m unittest discover -s tests -v

