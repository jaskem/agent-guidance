name: Bootstrap canonical foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify bootstrap archive
        run: |
          cat bootstrap/chunks/* > /tmp/agent-guidance-foundation.b64
          base64 -d /tmp/agent-guidance-foundation.b64 > /tmp/agent-guidance-foundation.tar.gz
          echo "b1c87281f5b97eafa0ab3b2e42fe55e66f86c0a31d920e6060b79bdd35f4c075  /tmp/agent-guidance-foundation.tar.gz" | sha256sum -c -
      - name: Materialize validated foundation without changing workflow files
        run: |
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          cp .github/workflows/ci.yml /tmp/ci.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/agent-guidance-foundation.tar.gz --exclude='.github/workflows/ci.yml'
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml
          cp /tmp/ci.yml .github/workflows/ci.yml
      - name: Check foundation structure
        run: python tools/check_foundation.py
      - name: Commit canonical foundation content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "bootstrap produced no repository delta" >&2; exit 1; }
          git commit -m "chore: materialize canonical agent guidance v0.1.0"
          git push origin HEAD:main
